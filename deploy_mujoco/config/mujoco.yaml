xml_path: "g1_description/scene.xml"
# Recovery-specific alternative (not validated with ScaleBFM): g1_description/g1_liao.xml
# xml_path: "g1_description/g1_29dof_LieDown.xml"
simulation_dt: 0.002
control_decimation: 10
render_hz: 60
torch_threads: 1
ghost_enabled: true        # show reference motion ghost; toggle with L3 at runtime
ghost_rgba: [0.2, 0.9, 0.4, 0.2]  # [R, G, B, alpha]  lower alpha = more transparent
tau_limit: [88, 139, 88, 139, 50, 50,
            88, 139, 88, 139, 50, 50,
            88, 50, 50,
            25, 25, 25, 25, 25, 5, 5,
            25, 25, 25, 25, 25, 5, 5
           ]

logging:
  enabled: false      # set true to record a freekick log
  log_dir: "logs"
  tag:     "freekick"
  states:  ["SKILL_FREEKICK", "LOCOMODE", "SKILL_BEYONDMIMIC", "SKILL_BEYONDMIMIC_MJ", "SKILL_STANDUP_MJ", "SKILL_PINOCCHIO_1_6_MJ", "SKILL_AMP", "SKILL_SMP_RECOVERY", "SKILL_SCALEBFM", "SKILL_PHP_PARKOUR"]  # FSM states to record


# ScaleBFM options are shared in config/deploy.yaml.

# Optional scene-specific motion; other ScaleBFM options are in config/deploy.yaml.
scalebfm:
  motion: null

# Orbit/zoom remain interactive while the camera tracks the robot.
camera:
  follow: true
  body: torso_link
  distance: 3.2
  azimuth: 45
  elevation: -25
  lookat: [0, 0, 0.8]  # used when follow=false
