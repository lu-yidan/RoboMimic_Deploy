xml_path: "g1_description/scene_with_ball.xml"
simulation_dt: 0.002
control_decimation: 10
ball_sensor_hz: 10   # simulated ball sensor update rate (10 Hz = every 5 control steps)
ghost_enabled: true
ghost_rgba: [0.2, 0.9, 0.4, 0.2]
tau_limit: [88, 139, 88, 139, 50, 50,
            88, 139, 88, 139, 50, 50,
            88, 50, 50,
            25, 25, 25, 25, 25, 5, 5,
            25, 25, 25, 25, 25, 5, 5
           ]

logging:
  enabled: true      # set true to record a score log
  log_dir: "logs"
  tag:     "score"
  states:  ["SKILL_SCORE", "LOCOMODE", "SKILL_BEYONDMIMIC", "SKILL_BEYONDMIMIC_MJ", "SKILL_STANDUP_MJ"]  # FSM states to record
