defaults:
  - mujoco
  - _self_

# Same upstream scene, physics dt, decimation and torque limits as mujoco.yaml.
baseline:
  output_dir: outputs/standup_baseline_v2
  hold_seconds: 2.0
  record_video: true
  video_fps: 25
  video_width: 1280
  video_height: 720
  acceptance:
    initial_root_height_max_m: 0.20
    final_hold_root_height_min_m: 0.65
    final_hold_root_height_mean_min_m: 0.70
    final_hold_tilt_max_deg: 25.0
    motion_joint_rmse_max_rad: 0.35
