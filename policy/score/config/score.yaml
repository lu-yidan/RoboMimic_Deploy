# onnx_path:   "policy-obs-fg8.onnx"
# onnx_path:   "policy-obs-aic.onnx"
onnx_path:   "policy-obs-325-uz8.onnx"
motion_path: "score_motion.npz"

control_dt:      0.02     # 50 Hz control (sim: 2ms * 10 decimation)
warmup_steps:    10       # interpolation steps from current pose to motion t=0
clip_actions:    10.0     # PPO actions rarely exceed ±3; prevents runaway divergence

# false = simulation (ball_pos from MuJoCo world frame)
# true  = real robot (ball_pos from DDS, already in pelvis body frame)
use_body_frame_ball: false

# Optional: clip motion to a specific time window (seconds).
# If omitted, the full motion sequence is used.
# motion_start_s:  0.0
# motion_end_s:   10.0

# If true, the reference motion is frozen at frame 0 for the entire episode.
# Useful for debugging pose-tracking behaviour without motion progression.
freeze_motion_at_first_frame: true

# If true, anchor_pos_b is always [0, 0, 0] (anchor treated as coincident with torso).
zero_anchor_pos: false

# If true, anchor_pos_b is set to the ball position expressed in the torso body frame,
# instead of the reference-motion anchor position.
# Has no effect when zero_anchor_pos is true (zero_anchor_pos takes priority).
ball_as_anchor_pos: true

# If true, anchor_ori_6d is computed so its +X axis always points toward the ball
# (world-frame direction from torso to ball, with Z = ref-anchor height - torso height).
# Overrides the default reference-motion orientation.
ball_facing_anchor_ori: true

# Target position in world frame [x, y, z] (e.g. goal center ~5m ahead)
target_pos: [4.0, 0.0, 0.0]

# All arrays below are in MuJoCo DFS joint order (== hardware order).
# Fill in from ONNX metadata after training.

default_joint_pos: [-0.312,  0.000,  0.000,  0.669, -0.363,  0.000,
                    -0.312,  0.000,  0.000,  0.669, -0.363,  0.000,
                     0.000,  0.000,  0.000,
                     0.200,  0.200,  0.000,  0.600,  0.000,  0.000,  0.000,
                     0.200, -0.200,  0.000,  0.600,  0.000,  0.000,  0.000]

action_scale: [0.548, 0.351, 0.548, 0.351, 0.439, 0.439,
               0.548, 0.351, 0.548, 0.351, 0.439, 0.439,
               0.548, 0.439, 0.439,
               0.439, 0.439, 0.439, 0.439, 0.439, 0.075, 0.075,
               0.439, 0.439, 0.439, 0.439, 0.439, 0.075, 0.075]

tau_limit: [88,  139,  88,  139,  50,  50,
            88,  139,  88,  139,  50,  50,
            88,   50,  50,
            25,   25,  25,   25,  25,   5,   5,
            25,   25,  25,   25,  25,   5,   5]

kps: [ 40.179,  99.098,  40.179,  99.098,  28.501,  28.501,
       40.179,  99.098,  40.179,  99.098,  28.501,  28.501,
       40.179,  28.501,  28.501,
       14.251,  14.251,  14.251,  14.251,  14.251,  16.778,  16.778,
       14.251,  14.251,  14.251,  14.251,  14.251,  16.778,  16.778]

kds: [  2.558,   6.309,   2.558,   6.309,   1.814,   1.814,
        2.558,   6.309,   2.558,   6.309,   1.814,   1.814,
        2.558,   1.814,   1.814,
        0.907,   0.907,   0.907,   0.907,   0.907,   1.068,   1.068,
        0.907,   0.907,   0.907,   0.907,   0.907,   1.068,   1.068]
