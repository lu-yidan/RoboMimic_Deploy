# Shared by MuJoCo, Python DDS and the C++ bridge. Restart after changes.
scalebfm:
  enabled: false
  root: ~/workspace/ScaleBFM
  checkpoint: null
  motion: null
  reference_forcing: true
  cuda_graph: true
  motion_globs:
    - outputs/duobox_scalebfm/batch15_v1/motions/*.npz
    - outputs/duobox_scalebfm/comparison*/motions/*.npz

amp:
  profile: amp_0309_1
  # amp_0309_1 | stratified_guidance_60000 | stratified_single_60000

smp:
  profile: v34_balanced4_hard19000
  # path_a6_9999 | a6_no_alpha_9999 | v34_balanced4_hard19000

# Right-top tmux camera; starting the policy never opens USB.
camera:
  mode: gray  # gray | php_depth (independent of php.real.enabled)

# PHP FSM policy (MuJoCo depth camera). Weights remain outside this repository.
php:
  enabled: true
  root: ~/workspace/php_parkour
  model_dir: ~/.cache/php-parkour/student
  # Bridge PHP is opt-in independently of simulation. No hardware is opened by default.
  real:
    enabled: false
    camera_config: policy/php_parkour/config/real_depth.yaml
    # Optional control IPC path; default /dev/shm/robomimic-<uid>/php-depth.npz
    # depth_file: /dev/shm/robomimic/php-depth.npz
    # Optional shared preview path; default /dev/shm/robomimic-<uid>/php-depth.json
    # dashboard_file: /dev/shm/robomimic/php-depth.json
