defaults:
  - mujoco
  - _self_

# Select an isolated LYD_DEPLOY_CONFIG with acp.enabled: true and php.enabled:
# false. The weights and exported contract live in acp.model_dir.
startup_policy: loco
# Set this to the fixed bundle_stage3_1000 directory on this host.
acp_bundle: null
keyboard_control: true
joystick_required: false
simulation_dt: 0.005
control_decimation: 4
ghost_enabled: false
php_depth_preview: false
scene:
  name: none

logging:
  enabled: true
  log_dir: logs
  tag: acp_mujoco
  states: [LOCOMODE, SKILL_ACP, FIXEDPOSE, PASSIVE]

camera:
  follow: true
  body: torso_link
  distance: 3.4
  azimuth: 135
  elevation: -18

hydra:
  job:
    chdir: false
