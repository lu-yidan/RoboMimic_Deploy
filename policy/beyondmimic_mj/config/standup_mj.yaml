onnx_path:   "beyondmimic_mj.onnx"
motion_path: "fallAndGetUp2_subject2_mj.npz"

control_dt:      0.02     # 50 Hz control (sim: 5ms * 4 decimation)
warmup_steps:    10       # interpolation steps from current pose to motion t=0
clip_actions:    10.0     # PPO actions rarely exceed ±3; prevents runaway divergence

# Clip motion to the stand-up action window.
motion_start_s:  10.0
motion_end_s:    19.0


