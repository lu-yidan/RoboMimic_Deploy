# onnx_path:   "policy-obs-33.onnx"
# onnx_path:   "policy-obs-aic.onnx"
# onnx_path:   "policy-obs-a2c.onnx"
# onnx_path:   "policy-obs-325-uz8.onnx"
# onnx_path:   "policy-obs-utf8-486.onnx"
# onnx_path:   "policy-obs-410-vvj.onnx"
onnx_path:   "policy-obs-ae.onnx"
# onnx_path:   "policy-obs-54-vhh.onnx"
# onnx_path:   "policy-obs-54-4s.onnx"
motion_path: "score_motion.npz"

control_dt:      0.02     # 50 Hz control (sim: 2ms * 10 decimation)
warmup_steps:    10       # interpolation steps from current pose to motion t=0
clip_actions:    6.0      # fallback raw-action clip for joints not listed below
action_clip:
  .*_hip_yaw_joint:   [-6.0, 6.0]
  .*_hip_roll_joint:  [-6.0, 6.0]
  .*_hip_pitch_joint: [-6.0, 6.0]
  .*_knee_joint:      [-6.0, 6.0]
  .*_ankle_pitch_joint: [-3.0, 3.0]
  .*_ankle_roll_joint:  [-0.6, 0.6]
  waist_yaw_joint:    [-3.0, 3.0]
  waist_roll_joint:   [-1.2, 1.2]
  waist_pitch_joint:  [-1.2, 1.2]
  .*_shoulder_pitch_joint: [-2.0, 2.0]
  .*_shoulder_roll_joint:  [-3.0, 3.0]
  .*_shoulder_yaw_joint:   [-3.0, 3.0]
  .*_elbow_joint:          [-3.0, 3.0]
  .*_wrist_roll_joint:     [-3.0, 3.0]
  .*_wrist_pitch_joint:    [-3.0, 3.0]
  .*_wrist_yaw_joint:      [-3.0, 3.0]

# motion_start_s:  2.5
# motion_end_s:   10.0

# false = simulation (ball_pos from MuJoCo world frame)
# true  = real robot (ball_pos from DDS, already in pelvis body frame)
use_body_frame_ball: false

# When ball_valid is false and sensor ball is ~zero: use this pelvis-frame default for
# soccer_pos_b history, ball_as_anchor_pos blend, and ball_facing_anchor_ori (not raw [0,0,0]).
# Omit key to disable substitution.
ball_obs_default_when_lost: [2.0, 0.0, -0.7]
ball_obs_lost_norm_max: 1.0e-3

# Real trigger ball velocity estimator: 2D constant-velocity Kalman filter
# over pelvis-frame [x, y, vx, vy]. Larger pos_std trusts measurements less;
# larger accel_std lets velocity change faster.
ball_vel_kf_pos_std: 0.04        # metres
ball_vel_kf_accel_std: 5.0       # m/s^2
ball_vel_kf_init_vel_std: 2.0    # m/s
ball_vel_kf_outlier_dist: 0.8    # metres; reset filter on larger innovation

# Optional: clip motion to a specific time window (seconds).
# If omitted, the full motion sequence is used.
# motion_start_s:  0.0
# motion_end_s:   10.0

# If true, the reference motion is frozen at frame 0 for the entire episode.
# Useful for debugging pose-tracking behaviour without motion progression.
freeze_motion_at_first_frame: false

# Simulation-first manual Score control.
# R3 triggers the kick; left stick commands a small relative anchor x/y goal;
# right stick horizontal commands relative yaw.
manual_trigger: true
manual_anchor_cmd: true
manual_anchor_pos_scale_xy: [0.04, 0.04]
manual_anchor_yaw_scale: 0.01
manual_cmd_deadzone: 0.02

# If true, anchor_pos_b is always [0, 0, 0] (anchor treated as coincident with torso).
zero_anchor_pos: false

# If true, anchor_pos_b is set to the ball position expressed in the torso body frame,
# instead of the reference-motion anchor position.
# Has no effect when zero_anchor_pos is true (zero_anchor_pos takes priority).
ball_anchor_cmd_scale: 0.2
ball_as_anchor_pos: false

# If true, anchor_ori_6d is computed so its +X axis always points toward the ball
# (world-frame direction from torso to ball, with Z = ref-anchor height - torso height).
# Overrides the default reference-motion orientation.
ball_facing_anchor_ori: false

# Target source:
# - fixed:    use `target_pos`
# - apriltag: use rt/target_state (AprilTag / target detector) on real robot
target_source: fixed

# If target_source=apriltag and the tag is lost:
# - true:  keep the last seen target direction in a yaw/world cache and
#          rotate it back into the current pelvis frame using IMU yaw
# - false: do not hold with IMU
target_hold_on_loss_with_imu: true

# If target_source=apriltag but no valid target has been seen yet (or IMU hold is disabled),
# fall back to the configured fixed target_pos.
target_use_fixed_fallback: true

# Fixed target:
# - Simulation: world-frame target position [x, y, z]
# - Real robot: entry时刻记录的 pelvis/body-frame target offset
target_pos: [5.0, 0.0, 0.115]

# Ball-trigger gate: hold at frame 0 until the ball enters the circle.
# When `trigger_play_end_frame` is set, on trigger play inclusive segment
# [trigger_frame, trigger_play_end_frame], then return to frame 0 and wait
# (ball must leave the trigger zone once before the next trigger).
# If `trigger_play_end_frame` is omitted, plays from `trigger_frame` to clip end (one-shot).
wait_for_ball:   true
trigger_play_once: false
trigger_radius:  0.25    # metres
trigger_horizon: 0.4    # look-ahead seconds
trigger_base_offset_xy: [0.15, -0.1]  # torso frame: +x forward, +y left; right is negative y
trigger_frame:            250   # first motion frame on trigger (loaded clip indices)
trigger_play_end_frame:   300   # last motion frame inclusive (252..302 = 51 frames)
# Default settings:
# wait_for_ball:   false
# trigger_frame:   0  
# freeze_motion_at_first_frame: true
# All arrays below are in MuJoCo DFS joint order (== hardware order).
# Fill in from ONNX metadata after training.

default_joint_pos: [-0.312,  0.000,  0.000,  0.669, -0.363,  0.000,
                    -0.312,  0.000,  0.000,  0.669, -0.363,  0.000,
                     0.000,  0.000,  0.000,
                     0.200,  0.200,  0.000,  0.600,  0.000,  0.000,  0.000,
                     0.200, -0.200,  0.000,  0.600,  0.000,  0.000,  0.000]

action_scale: [0.548, 0.351, 0.548, 0.351, 0.439, 0.439,
               0.548, 0.351, 0.548, 0.351, 0.439, 0.439,
               0.548, 0.439, 0.439,
               0.439, 0.439, 0.439, 0.439, 0.439, 0.075, 0.075,
               0.439, 0.439, 0.439, 0.439, 0.439, 0.075, 0.075]

kps: [ 40.179,  99.098,  40.179,  99.098,  28.501,  28.501,
       40.179,  99.098,  40.179,  99.098,  28.501,  28.501,
       40.179,  28.501,  28.501,
       14.251,  14.251,  14.251,  14.251,  14.251,  16.778,  16.778,
       14.251,  14.251,  14.251,  14.251,  14.251,  16.778,  16.778]

kds: [  2.558,   6.309,   2.558,   6.309,   1.814,   1.814,
