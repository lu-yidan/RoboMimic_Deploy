# Isolated ACP runtime; select with LYD_DEPLOY_CONFIG=config/deploy_acp.yaml.
scalebfm:
  enabled: false
amp:
  profile: amp_0309_1
smp:
  profile: v34_balanced4_hard19000
php:
  enabled: false
acp:
  enabled: true
  entry_mode: loco  # B (LocoMode) -> Y (ACP), without a FixedPose ramp/reset.
  # A real Stage 3 export with manifest.json is required. No weights are bundled.
  model_dir: policy/acp/models
  target_position: [1.0, 0.0]  # metres in the localization world frame
  target_heading: 0.0         # radians in that same frame
  max_age_s: 0.15
  max_sync_skew_s: 0.04
  max_tilt_rad: 0.7
  min_clearance: 0.3
  real:
    enabled: false
    frame_id: map
